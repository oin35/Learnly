# Keeps the free Supabase project that stores synced progress from being paused.
# Supabase pauses a free project after 7 days without activity; this writes and reads one tiny row every day.
# The row's code (KEEPALIVEPING) can never clash with a person's sync code (those are 32 hex characters).
# If the ping fails (for example because the project was paused anyway), the run fails and GitHub sends an email.
name: Keep sync awake

on:
  schedule:
    - cron: "23 4 * * *" # every day, 04:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # the same public address and publishable key the app uses (src/lib/syncConfig.ts); no secrets here
      SYNC_URL: https://upojtqdflwsvgsnlrnfw.supabase.co
      SYNC_KEY: sb_publishable_zDzD0LewHzArFN5XO1Ee9w_p58r3TzO
    steps:
      - name: Write and read the keep-alive row
        run: |
          set -euo pipefail
          call() {
            curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 30 \
              -H "apikey: $SYNC_KEY" -H "Authorization: Bearer $SYNC_KEY" -H "Content-Type: application/json" \
              -X POST "$SYNC_URL/rest/v1/rpc/$1" -d "$2"
            echo
          }
          call save_progress '{"p_code":"KEEPALIVEPING","p_data":{"v":1,"keepalive":true}}'
          call load_progress '{"p_code":"KEEPALIVEPING"}' | tee out.json
          grep -q '"keepalive": *true' out.json
